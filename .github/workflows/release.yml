name: Release Extension

on:
  push:
    tags:
      - 'v*.*.*'

# Add permissions for GitHub release creation
permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      # @Reference: https://zenn.dev/link/comments/ab5ad0d93dac67
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Security audit
        run: pnpm audit

      - name: Clean dist directory
        run: rm -rf dist

      - name: Code quality checks
        run: |
          pnpm run prettier-check
          pnpm run eslint-check
          pnpm run type-check

      - name: Build extension
        run: pnpm run build

      - name: Package extension
        run: |
          # Check if dist/prod directory exists
          if [ ! -d "dist/prod" ]; then
            echo "::error::dist/prod directory not found. Please run build first."
            exit 1
          fi

          # Remove existing zip file
          rm -f free-ai-summarizer-*.zip

          # Create ZIP file
          cd dist/prod
          zip -r "../../free-ai-summarizer-${{ env.VERSION }}.zip" .
          cd ../..

          echo "Successfully created free-ai-summarizer-${{ env.VERSION }}.zip"

          # Verify the file was created
          ls -la free-ai-summarizer-*.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: free-ai-summarizer-*.zip

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: free-ai-summarizer-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Chrome Web Store
        id: store_upload
        # Chrome Web Store API v2 (v1.1 shuts down on 2026-10-15)
        run: bash .github/scripts/chrome-webstore.sh publish "free-ai-summarizer-${{ env.VERSION }}.zip"
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        continue-on-error: true

      - name: Check Chrome Web Store upload result
        if: always()
        run: |
          # job.status cannot detect the upload failure here: the upload step
          # runs with continue-on-error, so the job stays "success" either way.
          # steps.store_upload.outcome holds the step's own result instead.
          if [ "${{ steps.store_upload.outcome }}" == "success" ]; then
            echo "✅ Chrome Web Store submission completed — the new version goes live when the review passes"
            echo "   Confirm the Version field on the store listing afterwards"
          else
            echo "::warning::Chrome Web Store upload failed — check the 'Upload to Chrome Web Store' step log"
            echo "⚠️ Chrome Web Store upload failed, but workflow continued"
            echo ""
            echo "🔍 Troubleshooting:"
            echo ""
            echo "1. Read the error printed by the upload step; it names the failing request"
            echo "   (OAuth2 token, fetchStatus, upload or publish) and the likely cause"
            echo ""
            echo "2. Check the credentials without releasing: run the 'Chrome Web Store Check'"
            echo "   workflow (Actions > Chrome Web Store Check > Run workflow)"
            echo ""
            echo "3. Repository secrets (Settings > Secrets and variables > Actions):"
            echo "   - CHROME_PUBLISHER_ID: Developer Dashboard > Publisher > Settings"
            echo "   - CHROME_EXTENSION_ID: the item's URL in the Developer Dashboard"
            echo "   - CHROME_CLIENT_ID / CHROME_CLIENT_SECRET: a 'Desktop app' OAuth client in"
            echo "     Google Cloud Console > APIs & Services > Credentials, in a project with the"
            echo "     Chrome Web Store API enabled"
            echo "   - CHROME_REFRESH_TOKEN: expires after 6 months unused (7 days while the OAuth"
            echo "     consent screen is in 'Testing'). Re-issue it with 'npx chrome-webstore-upload-keys'"
            echo "     (OAuth2 Playground fails with redirect_uri_mismatch for Desktop clients)"
            echo ""
            echo "4. To publish this version by hand, upload free-ai-summarizer-${{ env.VERSION }}.zip"
            echo "   from the GitHub Release in the Developer Dashboard:"
            echo "   https://chrome.google.com/webstore/devconsole/"
            echo ""
            echo "5. API reference: https://developer.chrome.com/docs/webstore/api/reference/rest"
          fi

      - name: Build Firefox extension
        id: firefox_build
        continue-on-error: true
        run: |
          pnpm run build:firefox

          cd dist/firefox-prod
          zip -r "../../free-ai-summarizer-firefox-${{ env.VERSION }}.zip" .
          cd ../..

          # Source package for AMO review (tag checkout, so the version matches)
          git archive --format=zip -o "free-ai-summarizer-source-${{ env.VERSION }}.zip" HEAD

          ls -la free-ai-summarizer-firefox-*.zip free-ai-summarizer-source-*.zip

      - name: Lint Firefox extension
        id: firefox_lint
        if: steps.firefox_build.outcome == 'success'
        continue-on-error: true
        run: npx --yes web-ext@10.6.0 lint --source-dir dist/firefox-prod

      - name: Upload to Firefox Add-ons
        id: amo_upload
        if: steps.firefox_build.outcome == 'success' && steps.firefox_lint.outcome == 'success'
        continue-on-error: true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          # Secrets are registered after the first manual submission; skip until then
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::warning::AMO_JWT_ISSUER / AMO_JWT_SECRET are not set — skipping Firefox Add-ons submission"
            exit 0
          fi

          # Listed versions are signed only after AMO review, so do not wait for approval
          npx --yes web-ext@10.6.0 sign \
            --channel=listed \
            --source-dir dist/firefox-prod \
            --upload-source-code "free-ai-summarizer-source-${{ env.VERSION }}.zip" \
            --approval-timeout 0 \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Check Firefox Add-ons upload result
        if: always()
        run: |
          # continue-on-error keeps the job green, so inspect each Firefox step outcome instead
          if [ "${{ steps.firefox_build.outcome }}" == "success" ] && [ "${{ steps.firefox_lint.outcome }}" == "success" ] && [ "${{ steps.amo_upload.outcome }}" == "success" ]; then
            echo "✅ Firefox Add-ons steps completed (check the upload step log for a skipped submission)"
          else
            echo "::warning::Firefox Add-ons submission failed — build: ${{ steps.firefox_build.outcome }}, lint: ${{ steps.firefox_lint.outcome }}, upload: ${{ steps.amo_upload.outcome }}"
            echo "  - 'Version already exists' means this version was already submitted to AMO"
            echo "  - Re-issue API keys at https://addons.mozilla.org/developers/addon/api/key/ and update AMO_JWT_ISSUER / AMO_JWT_SECRET"
          fi
